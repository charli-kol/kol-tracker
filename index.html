<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL 推广数据管理系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f4;
    --bg3: #f0efea;
    --text: #1a1a18;
    --text2: #6b6b68;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 8px;
    --radius-lg: 12px;
    --success: #1D9E75;
    --danger: #D85A30;
    --info: #185FA5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #242422;
      --bg3: #2c2c2a;
      --text: #f0efea;
      --text2: #888780;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.22);
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .topbar-left .subtitle { font-size: 12px; color: var(--text2); margin-bottom: 3px; }
  .topbar-left h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .topbar-right { display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px; font-family: inherit; transition: background .15s; }
  .btn:hover { background: var(--bg2); }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:hover { opacity: 0.85; }
  .tabs { display: flex; gap: 4px; background: var(--bg2); border-radius: var(--radius); padding: 4px; margin-bottom: 1.5rem; width: fit-content; }
  .tab { padding: 6px 16px; border-radius: 6px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: var(--text2); font-family: inherit; transition: all .15s; display: flex; align-items: center; gap: 5px; }
  .tab.active { background: var(--bg); color: var(--text); font-weight: 500; border: 0.5px solid var(--border); }
  .region-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .rtab { padding: 6px 16px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg); cursor: pointer; font-size: 13px; color: var(--text2); font-family: inherit; display: flex; align-items: center; gap: 6px; transition: all .15s; }
  .rtab.active { border-color: var(--border2); color: var(--text); background: var(--bg2); font-weight: 500; }
  .rtab .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric-card { background: var(--bg2); border-radius: var(--radius); padding: 1rem; }
  .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .metric-value { font-size: 24px; font-weight: 600; }
  .metric-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .up { color: var(--success); }
  .dn { color: var(--danger); }
  .section { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .section-title { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }
  .chart-wrap { position: relative; width: 100%; height: 220px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; color: var(--text2); font-weight: 400; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg2); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .b-TR { background: #E6F1FB; color: #0C447C; }
  .b-TW { background: #FAEEDA; color: #633806; }
  .b-ES { background: #EAF3DE; color: #27500A; }
  .b-BR { background: #FAECE7; color: #712B13; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 12px; color: var(--text2); }
  .form-group input, .form-group select, .form-group textarea {
    padding: 7px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius);
    background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus { outline: 2px solid #378ADD44; border-color: #378ADD; }
  .view { display: none; }
  .view.active { display: block; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: var(--radius); font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 9999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .table-wrap { overflow-x: auto; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text2); font-size: 14px; padding: 2px 4px; border-radius: 4px; }
  .del-btn:hover { background: var(--bg2); color: var(--danger); }
  .empty { text-align: center; padding: 2rem; color: var(--text2); font-size: 13px; }
  .week-label { font-size: 12px; color: var(--text2); background: var(--bg2); padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div class="topbar-left">
      <div class="subtitle">KOL 推广管理系统</div>
      <h1><i class="ti ti-chart-bar"></i>数据看板</h1>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i>导出 CSV</button>
      <button class="btn btn-primary" onclick="showView('add')"><i class="ti ti-plus"></i>录入数据</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showView('dashboard')"><i class="ti ti-layout-dashboard"></i>总览</button>
    <button class="tab" onclick="showView('daily')"><i class="ti ti-calendar"></i>日报</button>
    <button class="tab" onclick="showView('weekly')"><i class="ti ti-chart-line"></i>周报</button>
    <button class="tab" onclick="showView('add')"><i class="ti ti-edit"></i>录入</button>
  </div>

  <!-- 总览 -->
  <div id="view-dashboard" class="view active">
    <div class="region-tabs">
      <button class="rtab active" onclick="setRegion('all')"><span class="dot" style="background:#888"></span>全部地区</button>
      <button class="rtab" onclick="setRegion('TR')"><span class="dot" style="background:#378ADD"></span>🇹🇷 土耳其</button>
      <button class="rtab" onclick="setRegion('TW')"><span class="dot" style="background:#BA7517"></span>🇹🇼 台湾</button>
      <button class="rtab" onclick="setRegion('ES')"><span class="dot" style="background:#3B6D11"></span>🌎 西语</button>
      <button class="rtab" onclick="setRegion('BR')"><span class="dot" style="background:#D85A30"></span>🇧🇷 巴西</button>
    </div>
    <div class="metrics-grid" id="metrics-grid"></div>
    <div class="two-col">
      <div class="section">
        <div class="section-header"><span class="section-title"><i class="ti ti-users"></i>新增用户趋势（近7天）</span></div>
        <div class="legend" id="legend-users"></div>
        <div class="chart-wrap"><canvas id="chart-users" role="img" aria-label="近7天新增用户趋势">近7天各地区新增用户。</canvas></div>
      </div>
      <div class="section">
        <div class="section-header"><span class="section-title"><i class="ti ti-coin"></i>消耗趋势（近7天）</span></div>
        <div class="legend" id="legend-cost"></div>
        <div class="chart-wrap"><canvas id="chart-cost" role="img" aria-label="近7天消耗趋势">近7天各地区消耗。</canvas></div>
      </div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title"><i class="ti ti-table"></i>各地区本周汇总</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>地区</th><th>推广数量</th><th>总消耗 (USD)</th><th>新增用户</th><th>平均 CPA</th><th>用户环比</th></tr></thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 日报 -->
  <div id="view-daily" class="view">
    <div class="section">
      <div class="section-header">
        <span class="section-title"><i class="ti ti-calendar"></i>日报记录</span>
        <span id="daily-count" style="font-size:12px;color:var(--text2);"></span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;">
        <select id="filter-region" onchange="renderDaily()" style="font-size:13px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;">
          <option value="">全部地区</option>
          <option value="TR">🇹🇷 土耳其</option>
          <option value="TW">🇹🇼 台湾</option>
          <option value="ES">🌎 西语</option>
          <option value="BR">🇧🇷 巴西</option>
        </select>
        <input type="month" id="filter-month" onchange="renderDaily()" style="font-size:13px;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>地区</th><th>推广数量</th><th>消耗 (USD)</th><th>新增用户</th><th>CPA</th><th>备注</th></tr></thead>
          <tbody id="daily-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 周报 -->
  <div id="view-weekly" class="view">
    <div class="section">
      <div class="section-header"><span class="section-title"><i class="ti ti-chart-bar"></i>各地区周度新增用户</span></div>
      <div class="chart-wrap" style="height:260px;margin-bottom:1rem;">
        <canvas id="chart-weekly" role="img" aria-label="各地区周度新增用户柱状图">各地区按周汇总的新增用户数。</canvas>
      </div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title"><i class="ti ti-table"></i>周报明细</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>周次</th><th>地区</th><th>推广数量</th><th>总消耗 (USD)</th><th>新增用户</th><th>平均 CPA</th></tr></thead>
          <tbody id="weekly-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 录入 -->
  <div id="view-add" class="view">
    <div class="section">
      <div class="section-header"><span class="section-title"><i class="ti ti-edit"></i>录入推广数据</span></div>
      <div class="form-grid">
        <div class="form-group"><label>日期 *</label><input type="date" id="f-date"></div>
        <div class="form-group">
          <label>地区 *</label>
          <select id="f-region">
            <option value="TR">🇹🇷 土耳其</option>
            <option value="TW">🇹🇼 台湾</option>
            <option value="ES">🌎 西语</option>
            <option value="BR">🇧🇷 巴西</option>
          </select>
        </div>
        <div class="form-group"><label>推广数量（条）</label><input type="number" id="f-count" placeholder="0" min="0"></div>
        <div class="form-group"><label>消耗（USD）</label><input type="number" id="f-cost" placeholder="0.00" min="0" step="0.01"></div>
        <div class="form-group"><label>新增用户</label><input type="number" id="f-users" placeholder="0" min="0"></div>
        <div class="form-group"><label>备注（可选）</label><input type="text" id="f-note" placeholder="活动名、KOL信息等"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:0.5rem;">
        <button class="btn btn-primary" onclick="addRecord()"><i class="ti ti-check"></i>保存数据</button>
        <button class="btn" onclick="clearForm()"><i class="ti ti-x"></i>清空</button>
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-title"><i class="ti ti-history"></i>最近录入（最新10条）</span>
        <button class="btn" style="font-size:12px;padding:4px 10px;" onclick="if(confirm('确认清空所有数据？'))clearAll()"><i class="ti ti-trash"></i>清空全部</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>地区</th><th>推广数量</th><th>消耗</th><th>新增用户</th><th>备注</th><th></th></tr></thead>
          <tbody id="recent-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REGIONS = {
  TR: { name: '土耳其', flag: '🇹🇷', color: '#378ADD' },
  TW: { name: '台湾',   flag: '🇹🇼', color: '#BA7517' },
  ES: { name: '西语',   flag: '🌎',  color: '#3B6D11' },
  BR: { name: '巴西',   flag: '🇧🇷', color: '#D85A30' },
};

let records = [];
let currentRegion = 'all';
let charts = {};

function loadRecords() {
  try { const s = localStorage.getItem('kol_records_v2'); records = s ? JSON.parse(s) : []; } catch(e) { records = []; }
}
function saveRecords() {
  try { localStorage.setItem('kol_records_v2', JSON.stringify(records)); } catch(e) {}
}

function getLast7Dates() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    out.push(d.toISOString().slice(0, 10));
  }
  return out;
}
function getWeekStr(ds) {
  const d = new Date(ds);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const w = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return d.getFullYear() + '-W' + String(w).padStart(2, '0');
}
function sum(arr, key) { return arr.reduce((s, r) => s + (parseFloat(r[key]) || 0), 0); }
function pct(a, b) { return b === 0 ? 0 : Math.round((a - b) / b * 100); }

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  const views = ['dashboard', 'daily', 'weekly', 'add'];
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', views[i] === v));
  if (v === 'dashboard') renderDashboard();
  if (v === 'daily') renderDaily();
  if (v === 'weekly') renderWeekly();
  if (v === 'add') renderRecent();
}

function setRegion(r) {
  currentRegion = r;
  const rs = ['all', 'TR', 'TW', 'ES', 'BR'];
  document.querySelectorAll('.rtab').forEach((t, i) => t.classList.toggle('active', rs[i] === r));
  renderDashboard();
}

function renderDashboard() {
  renderMetrics();
  renderTrendCharts();
  renderSummary();
}

function renderMetrics() {
  const all14 = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); all14.push(d.toISOString().slice(0, 10)); }
  const thisWeek = all14.slice(7);
  const prevWeek = all14.slice(0, 7);
  const base = currentRegion === 'all' ? records : records.filter(r => r.region === currentRegion);
  const tw = base.filter(r => thisWeek.includes(r.date));
  const pw = base.filter(r => prevWeek.includes(r.date));
  const items = [
    { label: '本周推广数量', icon: 'ti-speakerphone', val: sum(tw, 'count').toLocaleString() + ' 条', diff: pct(sum(tw,'count'), sum(pw,'count')) },
    { label: '本周消耗', icon: 'ti-coin', val: '$' + sum(tw, 'cost').toLocaleString(), diff: pct(sum(tw,'cost'), sum(pw,'cost')) },
    { label: '本周新增用户', icon: 'ti-users', val: sum(tw, 'users').toLocaleString() + ' 人', diff: pct(sum(tw,'users'), sum(pw,'users')) },
    { label: '平均 CPA', icon: 'ti-chart-pie', val: sum(tw,'users') > 0 ? '$' + (sum(tw,'cost')/sum(tw,'users')).toFixed(2) : '—', diff: null },
  ];
  document.getElementById('metrics-grid').innerHTML = items.map(m => `
    <div class="metric-card">
      <div class="metric-label"><i class="ti ${m.icon}"></i>${m.label}</div>
      <div class="metric-value">${m.val}</div>
      <div class="metric-sub">${m.diff !== null ? `<span class="${m.diff >= 0 ? 'up' : 'dn'}">${m.diff >= 0 ? '↑' : '↓'}${Math.abs(m.diff)}%</span> vs 上周` : '本周均值'}</div>
    </div>`).join('');
}

function renderTrendCharts() {
  const dates = getLast7Dates();
  const labels = dates.map(d => d.slice(5));
  const rks = currentRegion === 'all' ? Object.keys(REGIONS) : [currentRegion];
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
  const tickColor = isDark ? '#888' : '#999';

  const makeDS = (key) => rks.map(r => ({
    label: REGIONS[r].flag + ' ' + REGIONS[r].name,
    data: dates.map(d => sum(records.filter(x => x.date === d && x.region === r), key)),
    borderColor: REGIONS[r].color,
    backgroundColor: REGIONS[r].color + '28',
    tension: 0.35, pointRadius: 3, borderWidth: 2,
    fill: rks.length === 1,
  }));

  const opts = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11 }, color: tickColor } },
      y: { grid: { color: gridColor }, ticks: { font: { size: 11 }, color: tickColor, callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v } }
    }
  };

  ['chart-users', 'chart-cost'].forEach(id => { if (charts[id]) { charts[id].destroy(); delete charts[id]; } });

  document.getElementById('legend-users').innerHTML = rks.map(r =>
    `<span class="legend-item"><span class="legend-dot" style="background:${REGIONS[r].color}"></span>${REGIONS[r].flag} ${REGIONS[r].name}</span>`).join('');
  document.getElementById('legend-cost').innerHTML = document.getElementById('legend-users').innerHTML;

  charts['chart-users'] = new Chart(document.getElementById('chart-users'), { type: 'line', data: { labels, datasets: makeDS('users') }, options: opts });
  charts['chart-cost']  = new Chart(document.getElementById('chart-cost'),  { type: 'line', data: { labels, datasets: makeDS('cost')  }, options: opts });
}

function renderSummary() {
  const all14 = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); all14.push(d.toISOString().slice(0, 10)); }
  const tw = all14.slice(7); const pw = all14.slice(0, 7);
  const rks = currentRegion === 'all' ? Object.keys(REGIONS) : [currentRegion];
  document.getElementById('summary-tbody').innerHTML = rks.map(r => {
    const t = records.filter(x => x.region === r && tw.includes(x.date));
    const p = records.filter(x => x.region === r && pw.includes(x.date));
    const users = sum(t,'users'), cost = sum(t,'cost'), cnt = sum(t,'count');
    const pu = sum(p,'users'); const d = pct(users,pu);
    return `<tr>
      <td><span class="badge b-${r}">${REGIONS[r].flag} ${REGIONS[r].name}</span></td>
      <td>${Math.round(cnt).toLocaleString()}</td>
      <td>$${cost.toLocaleString()}</td>
      <td>${Math.round(users).toLocaleString()}</td>
      <td>${users > 0 ? '$' + (cost/users).toFixed(2) : '—'}</td>
      <td><span class="${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '↑' : '↓'}${Math.abs(d)}%</span></td>
    </tr>`;
  }).join('');
}

function renderDaily() {
  const fr = document.getElementById('filter-region').value;
  const fm = document.getElementById('filter-month').value;
  let data = [...records].sort((a,b) => b.date.localeCompare(a.date));
  if (fr) data = data.filter(r => r.region === fr);
  if (fm) data = data.filter(r => r.date.startsWith(fm));
  document.getElementById('daily-count').textContent = '共 ' + data.length + ' 条';
  document.getElementById('daily-tbody').innerHTML = data.length === 0
    ? `<tr><td colspan="7" class="empty">暂无数据，请先录入</td></tr>`
    : data.map(r => `<tr>
      <td>${r.date}</td>
      <td><span class="badge b-${r.region}">${REGIONS[r.region].flag} ${REGIONS[r.region].name}</span></td>
      <td>${(+r.count).toLocaleString()}</td>
      <td>$${(+r.cost).toLocaleString()}</td>
      <td>${(+r.users).toLocaleString()}</td>
      <td>${r.users > 0 ? '$' + (r.cost/r.users).toFixed(2) : '—'}</td>
      <td style="color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.note || '—'}</td>
    </tr>`).join('');
}

function renderWeekly() {
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.07)';
  const tickColor = isDark ? '#888' : '#999';

  const weekMap = {};
  records.forEach(r => {
    const wk = getWeekStr(r.date);
    if (!weekMap[wk]) weekMap[wk] = {};
    if (!weekMap[wk][r.region]) weekMap[wk][r.region] = { count:0, cost:0, users:0 };
    weekMap[wk][r.region].count += +r.count;
    weekMap[wk][r.region].cost  += +r.cost;
    weekMap[wk][r.region].users += +r.users;
  });
  const weeks = Object.keys(weekMap).sort().slice(-6);
  const rks = Object.keys(REGIONS);

  if (charts['chart-weekly']) { charts['chart-weekly'].destroy(); delete charts['chart-weekly']; }
  charts['chart-weekly'] = new Chart(document.getElementById('chart-weekly'), {
    type: 'bar',
    data: {
      labels: weeks,
      datasets: rks.map(r => ({
        label: REGIONS[r].flag + ' ' + REGIONS[r].name,
        data: weeks.map(w => weekMap[w] && weekMap[w][r] ? weekMap[w][r].users : 0),
        backgroundColor: REGIONS[r].color + 'cc',
        borderColor: REGIONS[r].color,
        borderWidth: 1,
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 11 }, padding: 12, boxWidth: 10, boxHeight: 10 } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: tickColor } },
        y: { grid: { color: gridColor }, ticks: { font: { size: 11 }, color: tickColor } }
      }
    }
  });

  let rows = '';
  weeks.slice().reverse().forEach(w => {
    rks.forEach(r => {
      const d = weekMap[w] && weekMap[w][r];
      if (!d) return;
      rows += `<tr>
        <td><span class="week-label">${w}</span></td>
        <td><span class="badge b-${r}">${REGIONS[r].flag} ${REGIONS[r].name}</span></td>
        <td>${Math.round(d.count).toLocaleString()}</td>
        <td>$${d.cost.toLocaleString()}</td>
        <td>${Math.round(d.users).toLocaleString()}</td>
        <td>${d.users > 0 ? '$' + (d.cost/d.users).toFixed(2) : '—'}</td>
      </tr>`;
    });
  });
  document.getElementById('weekly-tbody').innerHTML = rows || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
}

function renderRecent() {
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  const recent = [...records].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 10);
  document.getElementById('recent-tbody').innerHTML = recent.length === 0
    ? `<tr><td colspan="7" class="empty">还没有数据，快来录入第一条吧</td></tr>`
    : recent.map(r => `<tr>
      <td>${r.date}</td>
      <td><span class="badge b-${r.region}">${REGIONS[r.region].flag} ${REGIONS[r.region].name}</span></td>
      <td>${r.count}</td>
      <td>$${(+r.cost).toLocaleString()}</td>
      <td>${r.users}</td>
      <td style="color:var(--text2);font-size:12px;">${r.note || '—'}</td>
      <td><button class="del-btn" onclick="deleteRecord('${r.id}')"><i class="ti ti-trash"></i></button></td>
    </tr>`).join('');
}

function addRecord() {
  const date   = document.getElementById('f-date').value;
  const region = document.getElementById('f-region').value;
  const count  = parseFloat(document.getElementById('f-count').value) || 0;
  const cost   = parseFloat(document.getElementById('f-cost').value)  || 0;
  const users  = parseFloat(document.getElementById('f-users').value) || 0;
  const note   = document.getElementById('f-note').value.trim();
  if (!date) { toast('请填写日期'); return; }
  records.push({ id: Date.now() + Math.random().toString(36).slice(2), date, region, count, cost, users, note });
  saveRecords();
  clearForm();
  renderRecent();
  toast('✓ 数据已保存');
}

function clearForm() {
  ['f-count','f-cost','f-users','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  saveRecords();
  renderRecent();
  toast('已删除');
}

function clearAll() {
  records = [];
  saveRecords();
  renderRecent();
  toast('已清空全部数据');
}

function exportCSV() {
  if (records.length === 0) { toast('暂无数据可导出'); return; }
  const header = '日期,地区,推广数量,消耗(USD),新增用户,CPA,备注';
  const rows = records
    .sort((a,b) => b.date.localeCompare(a.date))
    .map(r => `${r.date},${REGIONS[r.region].name},${r.count},${r.cost},${r.users},${r.users>0?(r.cost/r.users).toFixed(2):''},"${r.note||''}"`);
  const csv = '\uFEFF' + [header, ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'KOL推广数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  toast('✓ CSV 已导出');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

loadRecords();
renderDashboard();
</script>
</body>
</html>
